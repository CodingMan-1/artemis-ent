<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Artemis · 手机自动化工作台</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png?v=2">
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/logo.png?v=2">
</head>
<body>
  <app-root></app-root>
<script>
(function () {
  var box = null;
  function show(title, detail) {
    if (!box) {
      box = document.createElement('div');
      box.id = 'boot-watchdog';
      box.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:999999;max-width:90vw;max-height:45vh;overflow:auto;background:#3a0d0d;color:#ffc9c9;border:1px solid #ff5c5c;border-radius:10px;padding:10px 12px;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;box-shadow:0 6px 24px rgba(0,0,0,.5);';
      document.documentElement.appendChild(box);
    }
    box.textContent += (title ? title + '\n' : '') + (detail || '') + '\n';
    box.scrollTop = box.scrollHeight;
  }
  window.addEventListener('error', function (e) { show('JS ERROR', (e.message || 'script error') + (e.filename ? ' @' + e.filename + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('REJECTION', (e.reason && (e.reason.stack || e.reason.message || String(e.reason))) || ''); });
  var t0 = Date.now();
  setTimeout(function () {
    var root = document.querySelector('app-root');
    if (!root || root.innerHTML.trim().length === 0) {
      show('BOOT-WATCHDOG', 'app-root 仍为空。scripts: ' + Array.prototype.map.call(document.scripts, function (s) { return (s.src && s.src.split('/').pop()) || '(inline)'; }).join(', '));
    }
  }, 12000);
})();
</script>
</body>
</html>
